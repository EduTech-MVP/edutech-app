name: edutech_app
description: "A new Flutter project."
 
publish_to: "none"  
 
version: 1.0.0+1

environment:
  sdk: ^3.8.1
 
dependencies:
  flutter:
    sdk: flutter
    ##provider for statemangement
  provider: 
  font_awesome_flutter: 
  ## http for apis
  http: 
  ##file picker to upload images 
  file_picker: 
  mime: ^1.0.0
  http_parser: 
   # For persisting login state
  shared_preferences: ^2.3.2 
 
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.1.0
  flutter_svg:

dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^5.0.0
 

flutter:
  
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: CascadiaCode
      fonts:
        - asset: assets/fonts/CascadiaCode-Bold.ttf
          weight: 700
